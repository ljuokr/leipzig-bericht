# Stil an SGL angelehnt (Typografie, Textgrau, cleane Anmutung), Leitfarbe
# aber bewusst abgesetzt von PHBern (Mauve/Altrosa) und SGL (Marine/Grün/
# Koralle): dunkles Bronze, WCAG AA (5,9:1 auf Weiss)
color:
  palette:
    bronze: "#8a5a00"
    textgrau: "#2f3743"
    weiss: "#ffffff"
  foreground: textgrau
  background: weiss
  primary: bronze

# Schriften selbst gehostet (keine Google-Requests zur Laufzeit);
# statische Schnitte, da Typst variable Fonts nur in einer Stärke rendert
typography:
  fonts:
    - family: Roboto
      source: file
      files:
        - path: fonts/Roboto-Regular.ttf
        - path: fonts/Roboto-Italic.ttf
          style: italic
        - path: fonts/Roboto-Medium.ttf
          weight: 500
        - path: fonts/Roboto-Bold.ttf
          weight: 700
        - path: fonts/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
  base:
    family: Roboto
  headings:
    family: Roboto
    color: primary
